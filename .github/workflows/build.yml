name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_roads:
        description: "Re-download roads from OpenStreetMap"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install shapely
      - name: Roads from OpenStreetMap
        if: ${{ inputs.refresh_roads || hashFiles('data/roads.json') == '' }}
        run: python scripts/build_roads.py
      - name: Reports and promises from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_reports.py
      - name: Save data
        run: |
          git config user.name "road-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then git commit -m "Refresh data [skip ci]" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - id: deploy
        uses: actions/deploy-pages@v4
