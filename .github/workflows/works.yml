name: Road works (tenders + construction)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_works.py"]
  schedule:
    - cron: "41 20 * * 0"   # weekly, Monday 02:11 IST
permissions:
  contents: write
concurrency: { group: works, cancel-in-progress: false }
jobs:
  works:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_works.py
      - name: Save
        run: |
          git config user.name "road-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/works.json
          git diff --cached --quiet || (git commit -m "Refresh road works [skip ci]" && git pull --rebase && git push)
