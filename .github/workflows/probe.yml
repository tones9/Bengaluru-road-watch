name: Probe data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "road-watch-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/ && git commit -m "Probe results [skip ci]" && git pull --rebase && git push
