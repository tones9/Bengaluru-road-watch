<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Watch · Bengaluru</title>
<meta name="description" content="Tap any road in Bengaluru to see who is responsible for fixing it, what residents have reported, and what candidates have promised.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--muted:#5d6470;--line:#e4e6ea;--bg:#fff;--soft:#f5f6f8;--red:#d92d20;--amber:#c27803;--green:#16803c;--blue:#1d4ed8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0}
.top{position:fixed;top:10px;left:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:520px}
.bar{pointer-events:auto;background:var(--bg);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
#q{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px}
button,.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost,button.ghost{background:var(--soft);color:var(--ink)}
.banner{pointer-events:auto;background:#fff7e6;border:1px solid #f5d48c;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.35}
.banner b{color:#8a5300}
#results{pointer-events:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);max-height:45vh;overflow:auto;display:none}
#results div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}#results div:hover{background:var(--soft)}
#results small{color:var(--muted)}
.sheet{position:fixed;z-index:1001;background:#fff;box-shadow:0 -4px 24px rgba(0,0,0,.18);overflow:auto;transition:transform .25s;left:0;right:0;bottom:0;max-height:72vh;border-radius:18px 18px 0 0;transform:translateY(110%)}
.sheet.open{transform:none}
@media(min-width:900px){.sheet{left:auto;top:10px;right:10px;bottom:10px;width:420px;max-height:none;border-radius:16px;transform:translateX(120%)}}
.sh{position:sticky;top:0;background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sh h2{margin:0;font-size:18px;line-height:1.25}.sh .sub{color:var(--muted);font-size:13px;margin-top:3px}
.x{margin-left:auto;background:var(--soft);color:var(--ink);padding:6px 10px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.status{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.s-red{background:#fde8e7;color:var(--red)}.s-green{background:#e6f4ea;color:var(--green)}.s-grey{background:var(--soft);color:var(--muted)}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0}
.chain .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chain .r{font-size:12px;color:var(--muted)}.chain .v{font-size:14.5px;font-weight:600}.chain .d{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.t-ok{background:#e6f4ea;color:var(--green)}.t-likely{background:#fff3d6;color:var(--amber)}.t-none{background:#fde8e7;color:var(--red)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .btn,.acts button{justify-content:center}
.item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13.5px;line-height:1.4}
.item a{color:var(--blue)}.muted{color:var(--muted);font-size:13px;line-height:1.45}
.src a{color:var(--muted);font-size:12px;display:block;margin:3px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:2000;font-size:14px;display:none}
.legend{position:fixed;left:10px;bottom:24px;z-index:999;background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);line-height:1.6}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3000;background:rgba(255,255,255,.85);font-weight:600}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="bar">
    <div class="brand">Road Watch<small>Bengaluru · all 369 wards</small></div>
    <input id="q" placeholder="Search a road or ward" autocomplete="off" aria-label="Search a road or ward">
    <button id="near" title="Find the road you're on">📍 Near me</button>
  </div>
  <div id="results"></div>
  <div class="banner" id="banner"></div>
</div>
<div class="legend"><div id="zoomhint" style="font-weight:600;margin-bottom:4px">Zoom in to tap side roads</div><div><i style="background:#d92d20"></i>Reported broken</div><div><i style="background:#16803c"></i>Reported fixed</div><div><i style="background:#ea580c"></i>Govt road work (tender)</div><div><i style="background:#7c3aed"></i>Under construction (OSM)</div><div><i style="background:#2563eb;opacity:.35"></i>No reports yet · tap any road</div></div>
<aside class="sheet" id="sheet" aria-live="polite"></aside>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Loading Bengaluru roads…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const REPO = "tones9/Bengaluru-road-watch";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); };

const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([12.97, 77.59], 12);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Wards: GBA 2025 via OpenCity'
}).addTo(map);
const renderer = L.canvas({ tolerance: 6 });
const MAJOR = new Set(["motorway","trunk","primary","secondary","tertiary"]);
const MINOR_ZOOM = 15;
const majorGroup = L.layerGroup().addTo(map), minorGroup = L.layerGroup(), reportGroup = L.layerGroup().addTo(map);

let OFF, WARDS = {}, REPORTS = {}, byId = {}, lines = {}, wardLayer, GRID, NAMES = [], WORKS = {}, WARD_WORKS = {}, WORKS_META = null;
const worksGroup = L.layerGroup().addTo(map);
const loadedCells = {};

const CLASS = { motorway:"Highway", trunk:"Highway", primary:"Arterial road", secondary:"Sub-arterial road", tertiary:"Main ward road", residential:"Ward / residential road", unclassified:"Ward road", living_street:"Residential lane" };
const cls = h => CLASS[h.replace("_link","")] || "Road";
const WEIGHT = { motorway:6, trunk:6, primary:5, secondary:4.5, tertiary:3.5 };
const corpOf = w => OFF.corporations[w.corporation] || { name: "GBA city corporation", commissioner: "" };

function owner(r, corp) {
  const [, name, hw, ref] = r; const n = name + " " + ref;
  if (/\bNICE\b/i.test(n)) return { v: "NICE Ltd (private toll road)", d: "The NICE Road / Peripheral Road is run by Nandi Infrastructure Corridor Enterprises under a concession, not by the corporation." };
  if (/\bNH\s?\d+/i.test(ref)) return { v: "National highway (NHAI)", d: `Tagged ${esc(ref)} in OpenStreetMap. National highway stretches, including flyovers and elevated sections, are usually NHAI's. Some city stretches are handed to the corporation, so confirm with both.` };
  if (/\bSH\s?\d+/i.test(ref)) return { v: `State highway: PWD or ${esc(corp)}`, d: `Tagged ${esc(ref)}. Inside city limits, state highways are often maintained by the corporation. Confirm before escalating.` };
  if (MAJOR.has(hw.replace("_link",""))) return { v: `${esc(corp)}: arterial & sub-arterial roads`, d: "Arterial and sub-arterial roads (about 1,682 km city-wide) are maintained through corporation contracts, overseen by the corporation's chief engineer. The road's class here comes from OpenStreetMap, not an official register." };
  return { v: `${esc(corp)}: ward roads`, d: "Ward and internal roads are handled by the corporation's engineers for this division and sub-division (below)." };
}

function lenKm(f) { let s = 0; for (let i = 2; i < f.length; i += 2) s += Math.hypot((f[i]-f[i-2]) * 108.7, (f[i+1]-f[i-1]) * 111.2); return s; }
function status(id) {
  const it = (REPORTS[id] || []).filter(x => x.kind === "report");
  if (!it.length) return { c: "grey", t: "No public reports yet" };
  const open = it.filter(x => x.state === "open").length;
  return open ? { c: "red", t: `${open} open report${open > 1 ? "s" : ""}` } : { c: "green", t: "Reported fixed" };
}
const daysTo = d => Math.ceil((new Date(d + "T23:59:59+05:30") - new Date()) / 864e5);
const mid = f => { const k = Math.floor(f.length / 4) * 2; return [f[k+1], f[k]]; };
const latlngs = f => { const ll = []; for (let i = 0; i < f.length; i += 2) ll.push([f[i+1], f[i]]); return ll; };

function addRoad(r, group) {
  if (byId[r[0]]) return; byId[r[0]] = r;
  if (REPORTS[r[0]] || WORKS[r[0]]) return; // drawn in reportGroup / worksGroup
  const major = MAJOR.has(r[2].replace("_link",""));
  lines[r[0]] = L.polyline(latlngs(r[5]), { renderer, interactive: false, color: "#2563eb", weight: major ? 5 : 4, opacity: major ? .18 : .12 }).addTo(group);
}
function drawReported(geom) {
  for (const [id, r] of Object.entries(geom || {})) {
    byId[r[0]] = r; const st = status(id).c;
    lines[r[0]] = L.polyline(latlngs(r[5]), { renderer, interactive: false, color: st === "green" ? "#16803c" : "#d92d20", weight: (WEIGHT[r[2].replace("_link","")] || 3) + 2, opacity: .9 }).addTo(reportGroup);
  }
}
function cellsInView() {
  const b = map.getBounds(), [S, W] = GRID.origin, c = GRID.cell, out = [];
  for (let i = Math.floor((b.getSouth() - S) / c); i <= Math.floor((b.getNorth() - S) / c); i++)
    for (let j = Math.floor((b.getWest() - W) / c); j <= Math.floor((b.getEast() - W) / c); j++) if (i >= 0 && j >= 0) out.push(i + "_" + j);
  return out;
}
function loadCell(c) {
  if (!loadedCells[c]) loadedCells[c] = fetch(`data/roads/c_${c}.json`).then(r => r.ok ? r.json() : []).then(rs => { for (const r of rs) addRoad(r, minorGroup); }).catch(() => {});
  return loadedCells[c];
}
async function syncMinor() {
  const on = map.getZoom() >= MINOR_ZOOM;
  if (on && !map.hasLayer(minorGroup)) minorGroup.addTo(map);
  if (!on && map.hasLayer(minorGroup)) map.removeLayer(minorGroup);
  $("#zoomhint").style.display = on ? "none" : "block";
  if (on && GRID) await Promise.all(cellsInView().map(loadCell));
}
map.on("moveend", syncMinor);

function card(id) {
  const r = byId[id]; if (!r) return;
  const [osm, name, hw, ref, key, flat, cell] = r; const w = WARDS[key] || {}; const corp = corpOf(w);
  const mla = OFF.mlas[String(w.assembly_no)];
  const o = owner(r, corp.name), st = status(id);
  const nm = name || `Unnamed ${cls(hw).toLowerCase()}`;
  const items = REPORTS[id] || [];
  const reps = items.filter(x => x.kind === "report"), proms = items.filter(x => x.kind === "promise");
  const m = mid(flat), days = daysTo(OFF.corporators.election_deadline);
  history.replaceState(null, "", "#road-" + id + "-c" + cell);
  const wardTxt = `Ward ${w.ward_no} ${esc(w.ward_name || "")}`;

  $("#sheet").innerHTML = `
  <div class="sh"><div><h2>${esc(nm)}</h2><div class="sub">${cls(hw)}${ref ? " · " + esc(ref) : ""} · ${lenKm(flat).toFixed(2)} km segment · ${wardTxt} · ${esc(w.corporation)}</div>
  <div style="margin-top:7px"><span class="status s-${st.c}">${st.t}</span></div></div><button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>

  <div class="sec"><h3>Who is responsible for fixing it</h3><ol class="chain">
    <li><span class="n">1</span><div><div class="r">Who maintains the road <span class="tag t-likely">LIKELY</span></div><div class="v">${o.v}</div><div class="d">${o.d}</div></div></li>
    <li><span class="n">2</span><div><div class="r">Engineers' office for this ward <span class="tag t-ok">OFFICIAL MAP</span></div><div class="v">${esc((w.subdivision||"").replace("ARO- ","Sub-division: "))}</div><div class="d">${esc((w.division||"").replace("RO- ","Division: "))} · Zone: ${esc(w.zone_name||"")} · ${wardTxt} (${esc(w.ward_name_kn||"")}), population ${(w.population||0).toLocaleString("en-IN")}</div></div></li>
    <li><span class="n">3</span><div><div class="r">Head of the corporation <span class="tag t-ok">VERIFIED</span></div><div class="v">${esc(corp.commissioner)}</div><div class="d">Commissioner, ${esc(corp.name)}. GBA Chief Commissioner: ${esc(OFF.gba.chief_commissioner)}.</div></div></li>
    <li><span class="n">4</span><div><div class="r">Ward corporator (elected) <span class="tag t-none">NONE</span></div><div class="v">No elected corporator</div><div class="d">${esc(OFF.corporators.detail)} ${days > 0 ? `<b>Election deadline in ${days} days</b> (31 Dec 2026; the election commission has asked for 31 Jan 2027).` : esc(OFF.corporators.election)}</div></div></li>
    <li><span class="n">5</span><div><div class="r">MLA for this area <span class="tag t-ok">VERIFIED</span></div><div class="v">${mla ? esc(mla.name) + " · " + esc(mla.party) : "Not found"}</div><div class="d">${mla ? esc(mla.constituency) + " constituency (no. " + w.assembly_no + "), elected " + mla.elected + ". MLAs don't repair roads themselves, but they control local development funds and can push the corporation." : ""}</div></div></li>
    <li><span class="n">6</span><div><div class="r">If the road was dug up</div><div class="v">The agency that dug it must restore it</div><div class="d">Water (BWSSB), power (BESCOM), gas and telecom need road-cutting permission and must restore the surface. The corporation's engineers should inspect it before signing off.</div></div></li>
  </ol></div>

  <div class="sec"><h3>Take action</h3><div class="acts">
    <button onclick="copyComplaint('${id}')">Copy complaint</button>
    <a class="btn ghost" target="_blank" rel="noopener" href="${issueUrl("report.yml", id, nm)}">Report publicly</a>
    <button class="ghost" onclick="copyPledge('${id}')">Copy pledge for candidates</button>
    <a class="btn ghost" target="_blank" rel="noopener" href="${issueUrl("promise.yml", id, nm)}">Record a promise</a>
  </div>
  <p class="muted" style="margin:10px 0 0">File it officially: call <b>${esc(OFF.complaint_channels[0].value)}</b>, ${esc(OFF.complaint_channels[1].value)}, or use the Namma Bengaluru (Sahaaya) app. Then add the complaint number to your public report so its progress can be tracked. Public reports need a free GitHub account.</p>
  <p class="muted" style="margin:8px 0 0">Share this road: <a href="https://wa.me/?text=${encodeURIComponent(nm + " (Ward " + w.ward_no + " " + (w.ward_name||"") + ") is broken. See who's responsible: " + shareUrl(id))}" target="_blank" rel="noopener" style="color:var(--blue)">WhatsApp</a> · <a href="https://www.google.com/maps?q=${m[0]},${m[1]}" target="_blank" rel="noopener" style="color:var(--blue)">Open in Google Maps</a></p>
  </div>

  ${worksSection(id, key)}

  <div class="sec"><h3>Resident reports (${reps.length})</h3>${reps.length ? reps.map(x => `<div class="item"><b>${esc(x.problem || "Report")}</b> · ${x.state === "fixed" ? '<span class="status s-green">fixed</span>' : x.state === "open" ? '<span class="status s-red">open</span>' : '<span class="status s-grey">closed</span>'}<br>Reported ${esc(x.created)}${x.since ? " · broken since " + esc(x.since) : ""}${x.complaint ? " · complaint no. " + esc(x.complaint) : ""}<br>${x.details ? esc(x.details) + "<br>" : ""}<a href="${esc(x.url)}" target="_blank" rel="noopener">See photos &amp; updates</a></div>`).join("") : `<p class="muted">No one has reported this stretch yet. A dated photo is the strongest evidence. Note that "first reported here" isn't the same as "broken since".</p>`}</div>

  <div class="sec"><h3>Promises (${proms.length})</h3>${proms.length ? proms.map(x => `<div class="item"><b>${esc(x.who)}</b> <span class="muted">(${esc(x.role)})</span><br>“${esc(x.promise)}”${x.deadline ? "<br>Deadline: <b>" + esc(x.deadline) + "</b>" : ""}<br>${x.verified ? '<span class="tag t-ok">SOURCE CHECKED</span> ' : '<span class="tag t-likely">UNCHECKED</span> '}<a href="${esc(x.url)}" target="_blank" rel="noopener">Source &amp; status</a></div>`).join("") : `<p class="muted">No promises recorded for this road. With the corporation election coming, ask candidates to commit to this stretch with a date, then record it here with a source.</p>`}</div>

  <div class="sec src"><h3>Sources</h3>
    ${[OFF.wards_source, ...OFF.corporation_sources, ...OFF.mla_sources, ...OFF.corporators.sources, ...OFF.gba.sources].map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("")}
    <a href="https://www.openstreetmap.org/way/${osm}" target="_blank" rel="noopener">This road in OpenStreetMap (way ${osm})</a>
    <span class="muted" style="font-size:12px">Officials checked ${esc(OFF.checked)}. "Likely" = worked out from road type; not yet confirmed by an official road register.</span>
  </div>`;
  $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
  highlight(id);
}

const STATUS_TXT = { PUBLISHED: "Tender open", CLOSED: "Bids closed", UNDER_EVALUATION: "Bids under evaluation", EVALUATION_COMPLETED: "Contractor selected", AWARDED: "Awarded" };
const rupees = v => v ? "₹" + (v >= 1e7 ? (v / 1e7).toFixed(2) + " crore" : (v / 1e5).toFixed(1) + " lakh") : "";
function tenderHtml(t) {
  return `<div class="item"><b>${esc(t.title)}</b><br>
  <span class="status ${t.status === "AWARDED" || t.status === "EVALUATION_COMPLETED" ? "s-green" : "s-grey"}">${esc(STATUS_TXT[t.status] || t.status)}</span>
  ${t.ecv ? " · estimate " + rupees(t.ecv) : ""}${t.bid ? " · winning bid " + rupees(t.bid) : ""}<br>
  Tender published ${esc(t.published || "?")}${t.awarded ? " · <b>awarded " + esc(t.awarded) + "</b> (work can start)" : ""}${t.contractor ? "<br>Contractor: <b>" + esc(t.contractor) + "</b>" : ""}<br>
  <span class="muted">Office: ${esc(t.office || t.corp)} · ${esc(t.no || "")} · matched by ${esc(t.match)}</span><br>
  <a href="https://kppp.karnataka.gov.in/supplier-registration-service/v1/api/portal-service/${t.nit}/works-tender-full-view" target="_blank" rel="noopener">Official tender record (KPPP)</a></div>`;
}
function worksSection(id, key) {
  if (!WORKS_META) return `<div class="sec"><h3>Government road works</h3><p class="muted">Loading tender data…</p></div>`;
  const own = WORKS[id] || [], ward = (WARD_WORKS[key] || []).filter(t => !own.includes(t)).slice(0, 5);
  return `<div class="sec"><h3>Government road works on this road (${own.length})</h3>
  ${own.length ? own.map(tenderHtml).join("") : `<p class="muted">No tender since 2025 names this road.</p>`}
  ${ward.length ? `<h3 style="margin-top:12px">Other road tenders in this ward (${(WARD_WORKS[key] || []).length})</h3>` + ward.map(tenderHtml).join("") : ""}
  <p class="muted" style="margin:6px 0 0">Tenders come from the Karnataka Public Procurement Portal. It publishes the tender and award dates but <b>not the completion deadline</b>, which sits in the tender document and work order. Ask the sub-division engineer for it, or file an RTI. Matching tenders to roads by name is automatic, so check the title.</p></div>`;
}
function drawWorks(w) {
  WORKS_META = w;
  for (const t of w.tenders || []) {
    for (const [rid] of t.roads || []) (WORKS[rid] ||= []).push(t);
    for (const k of t.wards || []) (WARD_WORKS[k] ||= []).push(t);
  }
  for (const [rid, r] of Object.entries(w.geom || {})) {
    if (REPORTS[rid]) continue;
    byId[r[0]] = r;
    if (lines[r[0]]) { [majorGroup, minorGroup].forEach(g => g.removeLayer(lines[r[0]])); }
    lines[r[0]] = L.polyline(latlngs(r[5]), { renderer, interactive: false, color: "#ea580c", weight: (WEIGHT[r[2].replace("_link","")] || 3) + 2, opacity: .85 }).addTo(worksGroup);
  }
  const SKIP = new Set(["service", "footway", "path", "cycleway", "steps", "track", "pedestrian", "bridleway", "corridor", "platform"]);
  w.construction = (w.construction || []).filter(c => !SKIP.has(c.kind));
  for (const c of w.construction) {
    const pl = L.polyline(latlngs(c.geom), { renderer, color: "#7c3aed", weight: 6, opacity: .85, dashArray: "8 6" }).addTo(worksGroup);
    pl.bindPopup(`<b>${esc(c.name || "Unnamed road")}</b><br>Under construction (${esc(c.kind || "road")})${c.start ? "<br>Started: " + esc(c.start) : ""}${c.opening ? "<br>Opening date in OpenStreetMap: " + esc(c.opening) + (c.opening < new Date().toISOString().slice(0, 10) ? " <i>(passed — may be out of date)</i>" : "") : "<br>No opening date recorded"}<br><a href="https://www.openstreetmap.org/way/${c.id}" target="_blank" rel="noopener">Source: OpenStreetMap</a>`);
    pl.on("click", e => L.DomEvent.stop(e));
  }
  const n = (w.tenders || []).length, nm = Object.keys(w.geom || {}).length;
  if (n) $("#banner").innerHTML += `<br>🚧 ${n} road tenders since 2025 (${nm} road segments matched) · ${(w.construction || []).length} roads under construction.`;
  if ($("#sheet").classList.contains("open")) { const h = location.hash.match(/^#road-(\d+)/); if (h) card(+h[1]); }
}

window.closeSheet = () => { $("#sheet").classList.remove("open"); highlight(null); history.replaceState(null, "", location.pathname); };

function issueUrl(t, id, nm) { return `https://github.com/${REPO}/issues/new?template=${t}&road_id=${id}&road_name=${encodeURIComponent(nm)}&title=${encodeURIComponent((t === "report.yml" ? "[Road] " : "[Promise] ") + nm)}`; }
const shareUrl = id => location.origin + location.pathname + "#road-" + id + "-c" + byId[id][6];

function complaintText(id) {
  const [, name, hw, , key, flat] = byId[id]; const w = WARDS[key]; const corp = corpOf(w); const nm = name || "Unnamed road"; const m = mid(flat);
  return `To: The Assistant Executive Engineer, ${w.subdivision.replace("ARO- ", "")} sub-division, ${w.division.replace("RO- ", "")} division, ${corp.name}
Cc: Commissioner, ${corp.name} (${corp.commissioner})

Subject: Damaged road – ${nm}, Ward ${w.ward_no} ${w.ward_name}

The road "${nm}" (${cls(hw)}) in Ward ${w.ward_no} ${w.ward_name} is badly damaged and unsafe for commuters.
Location: https://www.google.com/maps?q=${m[0]},${m[1]}

Please:
1. Repair this stretch and share the expected completion date.
2. If it was dug up by another agency (BWSSB, BESCOM, gas, telecom), name the agency and its restoration deadline.
3. Put up a public board at the site with the work status, contractor and deadline.

Photos attached. Please share a complaint/reference number.

Name:
Phone:`;
}
function pledgeText(id) {
  const [, name, , , key] = byId[id]; const w = WARDS[key]; const nm = name || "the road";
  return `To every candidate for Ward ${w.ward_no} ${w.ward_name}, ${corpOf(w).name} (GBA election):

Residents want a written commitment, with a date, to fix ${nm}. It has been broken for a long time.

Please reply with:
1. Your name and party
2. The date by which it will be repaired
3. How you will make it happen if elected

Your answer will be recorded publicly on Road Watch: ${shareUrl(id)}`;
}
async function copy(t, m) { try { await navigator.clipboard.writeText(t); toast(m); } catch { window.prompt("Copy this text:", t); } }
window.copyComplaint = id => copy(complaintText(id), "Complaint copied. Paste it into email or the Sahaaya app");
window.copyPledge = id => copy(pledgeText(id), "Pledge copied. Send it to candidates");

let hl;
function highlight(id) {
  if (hl) { map.removeLayer(hl); hl = null; }
  if (id == null) return;
  hl = L.polyline(latlngs(byId[id][5]), { renderer, interactive: false, color: "#1d4ed8", weight: 9, opacity: .85 }).addTo(map);
}
async function focusRoad(id, cell) {
  if (!byId[id] && cell) await loadCell(cell);
  if (!byId[id]) return false;
  const b = L.latLngBounds(latlngs(byId[id][5]));
  map.fitBounds(b, { maxZoom: 17, animate: false }); if (map.getZoom() < MINOR_ZOOM + 1) map.setView(b.getCenter(), MINOR_ZOOM + 1, { animate: false });
  await syncMinor(); card(id); return true;
}

function nearest(lat, lng) {
  let best = null, bd = 1e9; const kx = Math.cos(lat * Math.PI / 180);
  for (const r of Object.values(byId)) {
    if (!MAJOR.has(r[2].replace("_link","")) && !REPORTS[r[0]] && map.getZoom() < MINOR_ZOOM) continue;
    const f = r[5];
    for (let i = 2; i < f.length; i += 2) {
      const ax = (f[i-2]-lng)*kx, ay = f[i-1]-lat, bx = (f[i]-lng)*kx, by = f[i+1]-lat;
      const dx = bx-ax, dy = by-ay, L2 = dx*dx+dy*dy; let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const d = (ax+t*dx)**2 + (ay+t*dy)**2; if (d < bd) { bd = d; best = r; }
    } }
  return { r: best, m: Math.sqrt(bd) * 111200 };
}
const inCity = ll => wardLayer && wardLayer.getBounds().contains(ll);

// Tap anywhere: pick the nearest road within ~30 px. Zoomed out, side roads load first.
map.on("click", async e => {
  $("#results").style.display = "none";
  const ll = e.latlng, pxM = () => 156543.03 * Math.cos(ll.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
  let n = nearest(ll.lat, ll.lng);
  if (n.r && n.m <= Math.max((map.getZoom() < MINOR_ZOOM ? 10 : 30) * pxM(), 15)) return card(n.r[0]);
  if (!inCity(ll)) return toast("Outside GBA city limits");
  if (map.getZoom() < MINOR_ZOOM) { map.setView(ll, MINOR_ZOOM + 1, { animate: false }); await syncMinor(); n = nearest(ll.lat, ll.lng); if (n.r && n.m <= 40) return card(n.r[0]); return toast("Zoomed in. Now tap the road"); }
  toast("No mapped road here. Tap closer to a road");
});

let me;
$("#near").onclick = () => {
  if (!navigator.geolocation) return toast("Location isn't available on this device");
  toast("Finding you…");
  navigator.geolocation.getCurrentPosition(async p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    if (me) map.removeLayer(me); me = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1d4ed8", fillOpacity: 1 }).addTo(map);
    if (!inCity(ll)) { map.setView(ll, 13); return toast("You're outside GBA city limits"); }
    map.setView(ll, 17, { animate: false }); await syncMinor();
    const n = nearest(ll.lat, ll.lng);
    if (n.r && n.m <= 80) card(n.r[0]); else toast("No mapped road right here. Tap the road you're on");
  }, () => toast("Location permission denied. Search instead"), { enableHighAccuracy: true, timeout: 10000 });
};

let index = [];
$("#q").oninput = e => {
  const q = e.target.value.trim().toLowerCase(), box = $("#results");
  if (q.length < 2) { box.style.display = "none"; return; }
  const m = index.filter(x => x.l.includes(q)).sort((a, b) => a.l.indexOf(q) - b.l.indexOf(q)).slice(0, 15);
  box.innerHTML = m.length ? m.map((x, i) => `<div data-i="${i}">${esc(x.t)}<br><small>${esc(x.s)}</small></div>`).join("") : `<div><small>No match. Try another spelling</small></div>`;
  box.style.display = "block";
  box.querySelectorAll("[data-i]").forEach(d => d.onclick = async () => {
    const x = m[+d.dataset.i]; box.style.display = "none"; $("#q").value = x.t.replace(" (ward)", "");
    if (x.id) { if (!(await focusRoad(x.id, x.cell))) { map.setView([x.lat, x.lng], 17); toast("Tap the road to open it"); } }
    else wardLayer.eachLayer(l => { if (l.feature.properties.key === x.ward) map.fitBounds(l.getBounds()); });
  });
};
const wardLabel = w => `Ward ${w.ward_no} ${w.ward_name} · ${w.corporation}`;

(async () => {
  try {
    const get = u => fetch(u, { cache: "no-cache" }).then(r => r.ok ? r.json() : null);
    const [w, major, off, rep] = await Promise.all(["data/wards.geojson", "data/roads/major.json", "data/officials.json", "data/reports.json"].map(get));
    OFF = off; REPORTS = rep?.roads || {};
    for (const f of w.features) WARDS[f.properties.key] = f.properties;
    wardLayer = L.geoJSON(w, { renderer, interactive: false, style: { color: "#334155", weight: 1.1, opacity: .4, dashArray: "4 4", fill: false } }).addTo(map);
    map.fitBounds(wardLayer.getBounds(), { animate: false });
    drawReported(rep?.geom);
    if (major) { GRID = major; for (const r of major.roads) addRoad(r, majorGroup); }
    for (const [k, wd] of Object.entries(WARDS)) index.push({ t: wd.ward_name + " (ward)", l: wd.ward_name.toLowerCase(), s: `Ward ${wd.ward_no} · ${wd.corporation} · ${wd.assembly_constituency}`, ward: k });
    const days = daysTo(OFF.corporators.election_deadline);
    const nRep = Object.values(REPORTS).flat().filter(x => x.kind === "report").length;
    $("#banner").innerHTML = `<b>No elected corporators since 2020.</b> GBA election deadline: ${days > 0 ? days + " days" : "passed"}. Tap any road to see who's accountable${nRep ? ` · ${nRep} resident reports so far` : ""}.`;
    if (!major) $("#banner").innerHTML += "<br>Road data is still being downloaded; check back in a few minutes.";
    const openHash = async () => { const h = location.hash.match(/^#road-(\d+)(?:-c(\d+_\d+))?$/); if (h) await focusRoad(+h[1], h[2]); };
    window.addEventListener("hashchange", openHash); await openHash();
    syncMinor();
    get("data/works.json").then(w => { if (w) drawWorks(w); else WORKS_META = { tenders: [] }; });
    get("data/roads/names.json").then(ns => { for (const n of ns || []) index.push({ t: n[0], l: n[0].toLowerCase(), s: wardLabel(WARDS[n[3]] || {}), id: n[1], cell: n[2], lat: n[4], lng: n[5] }); });
  } catch (e) { console.error(e); toast("Couldn't load data"); }
  $("#loading").remove();
})();
</script>
</body>
</html>
